<!doctype html>
<!--
  回归夹具：验证「上传来源菜单」的挂载点与四个来源的哨兵传递。

  背景（真机实测根因）：0.1.7 上游把附件入口收进了「+」唤起的**命令面板**
  （其中一项叫「文件」），tools 行里不再有独立的回形针按钮。于是旧版
  「取隐藏 input 的前一个兄弟按钮」这一识别方式命中的是「+」本身，
  上传菜单被挂到「+」上、并在捕获阶段吞掉事件，把命令面板整个顶掉。

  现行做法：**不挂任何按钮**，改为拦隐藏 <input type="file"> 的 click ——
  无论用户从哪个入口触发 input，都在默认动作（系统选择器）之前接管，
  弹出自己的来源菜单。这样既不依赖命令面板的 DOM 结构，也不碰「+」。

  本夹具构造 0.1.7 的 DOM 结构，加载**真实的** plugin/lib/client.js，断言：
    A. 点「+」不弹上传菜单、且「+」的 click 不被吞（命令面板不受影响）
    B. dsh 自有入口触发 input.click() → 弹出菜单，且该次 click 的默认动作被拦
    C. 菜单含四个来源行（手机 / 沙箱 / 拍照 / 录像）
    D. 选「沙箱」→ accept = 沙箱哨兵，且 click 正常传递（不被拦）
    E. 选「手机」→ accept 被清空
    F. 选「拍照」→ accept = 拍照哨兵
    G. 选「录像」→ accept = 录像哨兵
    H. change 之后哨兵被复位

  用法：cd source && python -m http.server 8793
       浏览器开 http://127.0.0.1:8793/tools/webview_upload_accept_test.html
-->
<html lang="zh">
<head>
<meta charset="utf-8">
<title>DSHBox 上传来源菜单回归夹具</title>
<style>
  body { font: 13px/1.6 monospace; padding: 16px; }
  #log div { white-space: pre-wrap; }
  .pass { color: #0a0; }
  .fail { color: #c00; font-weight: bold; }
  #summary { font-size: 16px; font-weight: bold; margin-bottom: 12px; }
</style>
</head>
<body>
<div id="summary">running…</div>
<div id="log"></div>

<!-- 0.1.7 的 composer 结构：tools 行里只有「+」命令按钮与那个隐藏 file input。
     「附件」入口在「+」唤起的命令面板内部，不在这里。 -->
<div class="FDk7aW_frame" data-composer-card>
  <div class="InputBar_module_css_default_tools" id="tools">
    <button id="cmdBtn" type="button" class="InputBar_module_css_default_add"
            aria-label="添加文件或调用指令" aria-haspopup="listbox" aria-expanded="false">
      <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 3v10M3 8h10"/></svg>
    </button>
    <input type="file" id="fileInput" multiple hidden>
  </div>
</div>

<script>
window.__results = [];
function check(name, cond, detail) {
  window.__results.push({ name: name, pass: !!cond, detail: detail || "" });
}
window.__captured = null;
window.__ModuleLoader__ = { load: function (def) { window.__captured = def; } };
window.__pluginLoaded = new Promise(function (resolve, reject) {
  var s = document.createElement("script");
  s.src = "../app/src/main/assets/plugins/dsh-mobile-adapt/plugin/lib/client.js?t=" + Date.now();
  s.onload = function () { resolve(); };
  s.onerror = function () { reject(new Error("plugin load failed")); };
  document.head.appendChild(s);
});
</script>

<script>
(function () {
  var cmdBtn = document.getElementById("cmdBtn");
  var input = document.getElementById("fileInput");

  var inputClicks = 0;          // input.click() 被调用次数
  var nativeSeenAccept = [];    // 每次 click 时原生会读到的 accept
  var lastEvent = null;         // 最近一次由 click() 派发的事件（用于看默认动作是否被拦）
  var cmdClicks = 0;

  // 替身：不真的走浏览器默认动作（合成事件没有用户激活，本也不会弹选择器），
  // 而是派发一个等价的可取消 click 事件，供夹具观察 defaultPrevented。
  input.click = function () {
    inputClicks++;
    var ev = new MouseEvent("click", { bubbles: true, cancelable: true });
    lastEvent = ev;
    this.dispatchEvent(ev);
    nativeSeenAccept.push(this.getAttribute("accept"));
  };

  // dsh 自己的 handler：「+」打开命令面板
  cmdBtn.addEventListener("click", function () { cmdClicks++; });

  function fire(el, type) {
    el.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true }));
  }
  function pointerdown(el) {
    el.dispatchEvent(new PointerEvent("pointerdown", {
      bubbles: true, cancelable: true, pointerType: "touch",
    }));
  }
  function tapRow(source) {
    var row = document.querySelector('#dsh-upload-menu button[data-source="' + source + '"]');
    if (!row) return false;
    pointerdown(row);
    return true;
  }
  function menuPresent() { return !!document.getElementById("dsh-upload-menu"); }
  function rowCount() {
    var m = document.getElementById("dsh-upload-menu");
    return m ? m.querySelectorAll("button[data-source]").length : 0;
  }

  function report() {
    var log = document.getElementById("log");
    var failed = 0;
    window.__results.forEach(function (r) {
      var d = document.createElement("div");
      d.className = r.pass ? "pass" : "fail";
      d.textContent = (r.pass ? "PASS  " : "FAIL  ") + r.name + (r.detail ? "   [" + r.detail + "]" : "");
      log.appendChild(d);
      if (!r.pass) failed++;
    });
    var s = document.getElementById("summary");
    var n = window.__results.length;
    s.textContent = failed === 0 ? "ALL PASS (" + n + "/" + n + ")" : "FAILED " + failed + " / " + n;
    s.className = failed === 0 ? "pass" : "fail";
  }

  function boot() {
    window.__captured.factory(function () { return {}; })
      .apply({ layout: { toggleSidebar: function () {} }, slots: {} });
  }

  function run() {
    var def = window.__captured;
    check("插件已注册", !!def && typeof def.factory === "function");
    if (!def) { report(); return; }
    boot();

    // ---------- A. 「+」不得被劫持（本次修复的核心） ----------
    cmdClicks = 0;
    pointerdown(cmdBtn);
    check("A1 点「+」不弹上传菜单", !menuPresent());
    fire(cmdBtn, "click");
    check("A2 「+」的 click 未被吞（命令面板可开）", cmdClicks === 1, "cmdClicks=" + cmdClicks);

    // ---------- B. dsh 自有入口（命令面板「文件」）触发 input.click() ----------
    inputClicks = 0; nativeSeenAccept = []; lastEvent = null;
    input.click();                       // 模拟 inputHub.pickFiles()
    check("B1 dsh 自有入口触发后弹出上传菜单", menuPresent());
    check("B2 该次 click 的默认动作被拦（系统选择器不会打开）",
          !!lastEvent && lastEvent.defaultPrevented === true,
          "prevented=" + (lastEvent ? lastEvent.defaultPrevented : "n/a"));

    // ---------- C. 四个来源行齐全 ----------
    check("C1 菜单含 4 个来源行", rowCount() === 4, "rows=" + rowCount());
    ["phone", "sandbox", "camera-photo", "camera-video"].forEach(function (s) {
      check("C2 含来源行 " + s,
            !!document.querySelector('#dsh-upload-menu button[data-source="' + s + '"]'));
    });

    // ---------- D. 沙箱 ----------
    inputClicks = 0; nativeSeenAccept = []; lastEvent = null;
    check("D1 菜单含沙箱行", tapRow("sandbox"));
    check("D2 沙箱路径触发 input.click() 恰好一次", inputClicks === 1, "clicks=" + inputClicks);
    check("D3 原生读到 accept = 沙箱哨兵",
          nativeSeenAccept[0] === "application/x-dshbox-sandbox-upload",
          "accept=" + nativeSeenAccept[0]);
    check("D4 该次 click 默认动作未被拦（哨兵要正常传给原生）",
          !!lastEvent && lastEvent.defaultPrevented === false,
          "prevented=" + (lastEvent ? lastEvent.defaultPrevented : "n/a"));
    fire(input, "change");               // 复位

    // ---------- E. 手机 ----------
    input.setAttribute("accept", "application/x-dshbox-sandbox-upload");
    inputClicks = 0; nativeSeenAccept = [];
    tapRow("phone");
    check("E1 手机路径触发 input.click() 恰好一次", inputClicks === 1, "clicks=" + inputClicks);
    check("E2 手机路径原生读到「无 accept」", nativeSeenAccept[0] === null, "accept=" + nativeSeenAccept[0]);
    fire(input, "change");

    // ---------- F. 拍照 ----------
    inputClicks = 0; nativeSeenAccept = [];
    tapRow("camera-photo");
    check("F1 拍照路径触发 input.click() 恰好一次", inputClicks === 1, "clicks=" + inputClicks);
    check("F2 原生读到 accept = 拍照哨兵",
          nativeSeenAccept[0] === "application/x-dshbox-camera-photo",
          "accept=" + nativeSeenAccept[0]);
    fire(input, "change");

    // ---------- G. 录像 ----------
    inputClicks = 0; nativeSeenAccept = [];
    tapRow("camera-video");
    check("G1 录像路径触发 input.click() 恰好一次", inputClicks === 1, "clicks=" + inputClicks);
    check("G2 原生读到 accept = 录像哨兵",
          nativeSeenAccept[0] === "application/x-dshbox-camera-video",
          "accept=" + nativeSeenAccept[0]);
    fire(input, "change");

    // ---------- H. change 之后哨兵复位 ----------
    check("H1 change 后 accept 被清空（不污染 dsh 自有上传入口）",
          input.getAttribute("accept") === null, "accept=" + input.getAttribute("accept"));

    // ---------- I. 菜单在输入框禁用时给出提示而非静默失败 ----------
    input.disabled = true;
    inputClicks = 0;
    tapRow("sandbox");
    check("I1 输入框禁用时不触发 click", inputClicks === 0, "clicks=" + inputClicks);
    input.disabled = false;

    report();
  }

  window.__pluginLoaded.then(function () {
    try { run(); } catch (e) {
      check("夹具异常: " + e.message, false, String(e));
      report();
    }
  }, function (err) {
    check("插件加载失败: " + err.message, false, "");
    report();
  });
})();
</script>
</body>
</html>
