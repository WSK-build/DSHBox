# Runtime Bundle manifest — LAYERED distribution (no DSH).
#
# The runtime bundle now carries ONLY the "runtime env shell": base (L0),
# node (L1), android-side (L3). DSH is a SEPARATE distribution product and is
# NEVER listed here (hard constraint: bundle must not contain DSH).
#
# This file is regenerated by tools/pack_runtime.sh per returned layer hash;
# the checked-in version documents the schema and keeps placeholder hashes so
# the app and build tooling consume a stable shape. build_arm64_runtime_bundle.sh
# rewrites the sha256/size_bytes entries after a real build.
bundle:
  kind: runtime
  name: dshapp-runtime-debian-arm64
  version: 0.1.0
  arch: arm64
  built_at: 2026-08-16T07:33:00Z  # placeholder; overwritten by pack_runtime.sh
  compression: zstd   # zstd level 19 (see tools/pack_runtime.sh); .gz fallback if jniLibs ABI fails
  # Ordered assembly list. deps = required lower layers that must be present
  # before this layer is assembled onto the guest rootfs. NO dsh layer here.
  layers:
    - name: base
      version: 0.1.0
      sha256: ""   # filled by pack_runtime.sh
      size_bytes: 0  # filled by pack_runtime.sh
      env_file: .dshbox/env.d/base.sh
      file: base.tar.zst
      deps: []
    - name: node
      version: 24.19.0
      sha256: ""   # filled by pack_runtime.sh
      size_bytes: 0  # filled by pack_runtime.sh
      env_file: .dshbox/env.d/node.sh
      file: node.tar.zst
      deps: [base]
    - name: android-side
      version: 0.1.0
      sha256: ""   # filled by pack_runtime.sh
      size_bytes: 0  # filled by pack_runtime.sh
      env_file: .dshbox/env.d/android-side.sh
      file: android-side.tar.zst
      deps: [base]
