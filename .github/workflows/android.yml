name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install SDK packages
        run: |
          sdkmanager --update >/dev/null 2>&1 || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Grant execute permission to scripts
        run: chmod +x gradlew tools/*.sh runtime-bundle/scripts/*.sh runtime-bundle/build_rootfs.sh

      # 需要 python3 跑隐私审计
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 1.2.1 (P6)：多语言资源键位/占位符 parity + 源码硬编码 CJK 扫描
      - name: Run i18n consistency check
        run: bash tools/i18n_check.sh

      # v1.3.1：阻断「本机路径/用户名/凭据」随仓库公开
      # （实测踩到 docs/BUILD_RUNBOOK.md 带着开发机 JDK 路径并已公开）
      - name: Run privacy audit
        run: python3 tools/privacy_audit.py

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dshapp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
