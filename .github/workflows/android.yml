name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 仅安装仍受支持的 platform-tools，其余 SDK 包在下一步显式安装。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept licenses & install SDK packages
        run: |
          sdkmanager --update >/dev/null 2>&1 || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Grant execute permission to scripts
        run: chmod +x gradlew tools/*.sh runtime-bundle/scripts/*.sh runtime-bundle/build_rootfs.sh

      # 需要 python3 跑隐私审计
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 校验多语言资源键和占位符一致性，并扫描源码硬编码 CJK 文本。
      - name: Run i18n consistency check
        run: bash tools/i18n_check.sh

      # 官网资源查询串与 versionName 同步，避免静态缓存混用不同版本资源。
      - name: Check website asset version string
        run: |
          APP_VER=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "versionName=$APP_VER"
          for f in website/index.html website/404.html; do
            [ -f "$f" ] || continue
            vers=$(grep -o 'assets/[^"]*?v=[0-9][^"&]*' "$f" | sed 's/.*?v=//' | sort -u)
            if [ -z "$vers" ]; then
              echo "::error file=$f::未发现 ?v= 版本查询串"
              exit 1
            fi
            for v in $vers; do
              if [ "$v" != "$APP_VER" ]; then
                echo "::error file=$f::?v=$v 与 versionName=$APP_VER 不一致"
                exit 1
              fi
            done
          done
          echo "官网资源版本号已同步"

      # 审查当前 checkout，不允许因忽略规则放行已存在的本地凭据文件。
      - name: Run privacy audit
        run: |
          python3 -m unittest discover -s tools -p test_privacy_audit.py
          python3 tools/privacy_audit.py --strict

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dshapp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
